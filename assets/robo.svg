<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="vacuumTop" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4e5259"/>
      <stop offset="55%" stop-color="#282b30"/>
      <stop offset="100%" stop-color="#141619"/>
    </radialGradient>
    <linearGradient id="vacuumSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- Robot vacuum base (3D angled disc) -->
    <ellipse cx="138" cy="162" rx="92" ry="74" fill="url(#vacuumSide)"/>
    <ellipse cx="138" cy="148" rx="90" ry="72" fill="url(#vacuumTop)" stroke="#3e4249" stroke-width="2"/>
    <!-- Inner ring -->
    <ellipse cx="138" cy="146" rx="76" ry="59" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Sensor bumper line -->
    <path d="M58,125 A88,68 0 0,1 218,125" fill="none" stroke="#111315" stroke-width="3"/>
    <!-- Power button / lidar turret -->
    <ellipse cx="138" cy="115" rx="14" ry="11" fill="#1d2024" stroke="#5b6068" stroke-width="1.5"/>
    <circle cx="138" cy="115" r="4" fill="#38bdf8"/>
    <!-- Brand subtle text line -->
    <rect x="124" y="172" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
    <!-- Smartphone App Control (bottom right, just like the photo!) -->
    <rect x="200" y="168" width="44" height="82" rx="7" fill="#18191c" stroke="#444" stroke-width="1.5"/>
    <rect x="203" y="173" width="38" height="72" rx="4" fill="#ffffff"/>
    <!-- Phone UI elements -->
    <rect x="216" y="175" width="12" height="2" rx="1" fill="#d1d5db"/>
    <circle cx="222" cy="202" r="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="222" cy="202" r="4" fill="#3b82f6"/>
    <rect x="209" y="220" width="26" height="4" rx="2" fill="#e5e7eb"/>
    <rect x="213" y="228" width="18" height="4" rx="2" fill="#93c5fd"/>
    <circle cx="222" cy="239" r="3" fill="#10b981"/>
  </g>
</svg>