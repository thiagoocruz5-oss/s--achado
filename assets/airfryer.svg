<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3d42"/>
      <stop offset="45%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#0f1012"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8bcc2"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8c9199"/>
    </linearGradient>
    <linearGradient id="topSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef1f5"/>
      <stop offset="60%" stop-color="#c6cbd2"/>
      <stop offset="100%" stop-color="#8e949e"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Base shadow ellipse -->
    <ellipse cx="150" cy="262" rx="75" ry="12" fill="rgba(0,0,0,0.18)"/>
    <!-- Main body -->
    <path d="M88,65 C88,36 212,36 212,65 L224,195 C226,232 204,258 150,258 C96,258 74,232 76,195 Z" fill="url(#bodyGrad)"/>
    <!-- Silver top cap / control panel -->
    <path d="M90,62 C90,40 210,40 210,62 L214,120 C214,132 185,138 150,138 C115,138 86,132 86,120 Z" fill="url(#topSilver)"/>
    <!-- Gloss highlight left -->
    <path d="M96,70 Q88,160 98,238" stroke="rgba(255,255,255,0.18)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Basket seam -->
    <path d="M77,145 Q150,158 223,145" stroke="#111" stroke-width="3" fill="none"/>
    <path d="M78,225 Q150,238 222,225" stroke="url(#silverGrad)" stroke-width="3.5" fill="none"/>
    <!-- Dials on top panel -->
    <circle cx="150" cy="70" r="13" fill="#222" stroke="url(#silverGrad)" stroke-width="3"/>
    <line x1="150" y1="60" x2="150" y2="68" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="106" r="16" fill="#222" stroke="url(#silverGrad)" stroke-width="3.5"/>
    <line x1="150" y1="94" x2="150" y2="104" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Indicator lights -->
    <circle cx="122" cy="88" r="3" fill="#ff5722"/>
    <circle cx="178" cy="88" r="3" fill="#4caf50"/>
    <!-- Handle -->
    <rect x="136" y="142" width="28" height="96" rx="12" fill="#16181b" stroke="#34383e" stroke-width="2"/>
    <rect x="142" y="150" width="16" height="80" rx="6" fill="url(#silverGrad)"/>
    <rect x="145" y="158" width="10" height="14" rx="2" fill="#2b2e33"/>
  </g>
</svg>