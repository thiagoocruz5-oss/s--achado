<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3f34"/>
      <stop offset="35%" stop-color="#b86b5a"/>
      <stop offset="55%" stop-color="#d48c7a"/>
      <stop offset="85%" stop-color="#8c473b"/>
      <stop offset="100%" stop-color="#612d24"/>
    </linearGradient>
    <linearGradient id="lidGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(220,235,245,0.85)"/>
      <stop offset="50%" stop-color="rgba(160,185,200,0.55)"/>
      <stop offset="100%" stop-color="rgba(120,145,160,0.75)"/>
    </linearGradient>
    <filter id="panShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#panShadow)">
    <!-- Back Center Tall Casserole -->
    <g transform="translate(105, 58)">
      <!-- Handles -->
      <path d="M-16,32 C-28,28 -28,44 -14,44" fill="none" stroke="#3b231e" stroke-width="5" stroke-linecap="round"/>
      <path d="M126,32 C138,28 138,44 124,44" fill="none" stroke="#3b231e" stroke-width="5" stroke-linecap="round"/>
      <!-- Body -->
      <path d="M0,25 L110,25 L104,88 C103,98 92,104 55,104 C18,104 7,98 6,88 Z" fill="url(#copperGrad)"/>
      <!-- Glass Lid -->
      <path d="M0,25 Q55,2 110,25 Z" fill="url(#lidGlass)" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Lid Knob -->
      <rect x="46" y="6" width="18" height="7" rx="3.5" fill="#3b231e"/>
    </g>

    <!-- Back Left Saucepan -->
    <g transform="translate(36, 86)">
      <!-- Long Handle -->
      <path d="M-2,24 L-32,12" stroke="#3b231e" stroke-width="6" stroke-linecap="round"/>
      <!-- Body -->
      <path d="M0,18 L86,18 L81,68 C80,76 70,80 43,80 C16,80 6,76 5,68 Z" fill="url(#copperGrad)"/>
      <!-- Glass Lid -->
      <path d="M0,18 Q43,0 86,18 Z" fill="url(#lidGlass)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="35" y="4" width="16" height="6" rx="3" fill="#3b231e"/>
    </g>

    <!-- Middle Right Stew Pot -->
    <g transform="translate(185, 102)">
      <path d="M-12,26 C-22,22 -22,36 -10,36" fill="none" stroke="#3b231e" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M98,26 C108,22 108,36 96,36" fill="none" stroke="#3b231e" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M0,18 L86,18 L81,68 C80,76 70,80 43,80 C16,80 6,76 5,68 Z" fill="url(#copperGrad)"/>
      <path d="M0,18 Q43,0 86,18 Z" fill="url(#lidGlass)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="35" y="4" width="16" height="6" rx="3" fill="#3b231e"/>
    </g>

    <!-- Front Left Small Pot -->
    <g transform="translate(72, 140)">
      <path d="M-2,20 L-36,10" stroke="#3b231e" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M0,16 L76,16 L72,62 C70,69 62,73 38,73 C14,73 6,69 4,62 Z" fill="url(#copperGrad)"/>
      <path d="M0,16 Q38,0 76,16 Z" fill="url(#lidGlass)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="30" y="3" width="16" height="5" rx="2.5" fill="#3b231e"/>
    </g>

    <!-- Front Right Frying Pan (Frigideira) -->
    <g transform="translate(148, 168)">
      <!-- Long Handle to Right -->
      <path d="M104,24 L152,8" stroke="#3b231e" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Pan Body -->
      <path d="M4,20 L108,20 L98,44 C95,50 82,54 56,54 C30,54 17,50 14,44 Z" fill="url(#copperGrad)"/>
      <!-- Dark Non-stick Interior -->
      <ellipse cx="56" cy="20" rx="52" ry="12" fill="#22252a" stroke="#d48c7a" stroke-width="2"/>
    </g>
  </g>
</svg>